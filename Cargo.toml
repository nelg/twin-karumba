[package]
name = "twin-karumba-rs"
version = "0.1.0"
edition = "2024"

# `cargo build --release --features embed` packs assets/ into the executable,
# so the game is a single file. Without it, the game reads the assets folder.
[features]
embed = []

[dependencies]
libloading = "0.9.1"
macroquad = { version = "0.4", default-features = false }
serde_json = "1.0.154"

# Windows and macOS sound output (WASAPI / CoreAudio). Linux uses PulseAudio or ALSA
# directly through libloading instead (see src/audio.rs).
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18"

# Optimise dependencies even in debug builds so the game runs smoothly while developing.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true
