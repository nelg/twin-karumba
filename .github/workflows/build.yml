name: build

# Builds the single-file game (assets packed in with `--features embed`) for
# Windows, macOS (one universal file for Apple Silicon and Intel) and Linux.
# Every push and pull request keeps the builds as workflow artifacts.
#
# Releases: push the commit to the `release` branch (git push origin main:release)
# and the release v<version in Cargo.toml> is created with the three files
# attached; pushing a v* tag does the same for that tag. The file names don't carry
# the version, so the website can link to releases/latest/download/<name>.

on:
  push:
    branches: [main, release]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-universal
          # Ubuntu 22.04 links against an older glibc, so the build runs on more distributions
          - os: ubuntu-22.04
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ "$RUNNER_OS" = "macOS" ]; then rustup target add aarch64-apple-darwin x86_64-apple-darwin; fi

      - uses: Swatinem/rust-cache@v2

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev

      - name: Build (Windows, Linux)
        if: runner.os != 'macOS'
        run: cargo build --release --features embed

      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --features embed --target aarch64-apple-darwin
          cargo build --release --features embed --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/twin-karumba-rs \
            target/aarch64-apple-darwin/release/twin-karumba-rs \
            target/x86_64-apple-darwin/release/twin-karumba-rs

      - name: Package
        shell: bash
        run: |
          # only the game itself goes in the download: no README, LICENSE or AUTHORS
          name=twin-karumba-${{ matrix.name }}
          mkdir -p dist/pkg
          cd dist
          case "$RUNNER_OS" in
            Windows)
              cp ../target/release/twin-karumba-rs.exe pkg/twin-karumba.exe
              (cd pkg && 7z a -bd ../$name.zip twin-karumba.exe >/dev/null) ;;
            macOS)
              # a minimal app bundle, so it opens with a double-click (the bundle is
              # the executable plus the Info.plist macOS needs to launch it)
              app="pkg/Twin Karumba.app"
              mkdir -p "$app/Contents/MacOS"
              cp ../target/release/twin-karumba-rs "$app/Contents/MacOS/twin-karumba"
              cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Twin Karumba</string>
            <key>CFBundleDisplayName</key><string>Twin Karumba</string>
            <key>CFBundleIdentifier</key><string>nz.ogilvie.twinkarumba</string>
            <key>CFBundleExecutable</key><string>twin-karumba</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
              ditto -c -k --keepParent "$app" $name.zip ;;
            Linux)
              cp ../target/release/twin-karumba-rs pkg/twin-karumba
              tar czf $name.tar.gz -C pkg twin-karumba ;;
          esac
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: twin-karumba-${{ matrix.name }}
          path: dist/twin-karumba-${{ matrix.name }}.*

  # one release, made after all three builds, so the jobs don't race to create it
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release tag
        id: tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"
          else tag="v$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Twin Karumba ${{ steps.tag.outputs.tag }} (beta)
          body: |
            Beta build of Twin Karumba: level 1, for 1 or 2 players.
            Each download is a single program with everything built in.
            - Windows: unzip and run twin-karumba.exe (not signed yet: More info, Run anyway).
            - macOS (Apple Silicon and Intel): unzip and open Twin Karumba (first time: right-click, Open).
            - Linux (x86-64): unpack and run ./twin-karumba.
            See https://nelg.github.io/twin-karumba/ and the LICENSE (beta: not yet free to copy or change).
          files: dist/twin-karumba-*.*
